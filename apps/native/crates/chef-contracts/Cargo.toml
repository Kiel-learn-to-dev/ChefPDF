[package]
name = "chef-contracts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Mã sinh từ typify dùng derive của serde.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Probe R1.42: sinh struct Rust từ JSON Schema của lõi (typify, Apache-2.0, R1.04).
[build-dependencies]
typify = "0.4"
schemars = "0.8"
serde_json = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
