[package]
name = "chef-pdf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# pdfium-render 0.9.5 (MIT OR Apache-2.0). Chỉ có feature pdfium_8125; DLL của lõi là bản build 8076,
# nên bind có thể thất bại nếu thiếu symbol. Kiểm trong R1.28 (xem TASKS_RUST).
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_8125", "thread_safe"] }
