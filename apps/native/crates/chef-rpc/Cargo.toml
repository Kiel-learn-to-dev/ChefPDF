[package]
name = "chef-rpc"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
serde_json = "1"

# Job Object và tạo tiến trình ở trạng thái suspended (TASKS_RUST R3.02). Cùng phiên bản 0.57 mà chef-app
# và gpui đã dùng, nên Cargo.lock không thêm phiên bản mới.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.57", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
