[package]
name = "chef-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
# Lõi Python qua JSON-RPC (TASKS_RUST R3.01–R3.05). Chỉ có trên Windows.
chef-rpc = { path = "../chef-rpc" }
# Cùng phiên bản 0.6 mà gpui dùng, để lấy HWND của cửa sổ.
raw-window-handle = "0.6"
# Cùng phiên bản 0.25 mà gpui dùng (image::Frame của RenderImage).
image = "0.25"
chef-pdf = { path = "../chef-pdf" }
chef-viewer = { path = "../chef-viewer" }
chef-theme = { path = "../chef-theme" }
chef-ui = { path = "../chef-ui" }
# Đọc và ghi settings.json (TASKS_RUST R2.14). Cùng phiên bản với chef-ui.
serde_json = "1"
# Xóa mật khẩu khỏi bộ nhớ sau khi dùng (TASKS_RUST R2.26). Đã có trong Cargo.lock (Apache-2.0 hoặc MIT).
zeroize = "1"
# Cùng phiên bản 0.57 mà Cargo.lock đã có (qua gpui). Dùng để chụp cửa sổ bằng
# Windows.Graphics.Capture (chỉ dùng trong kênh debug, R1.07/R1.08).
windows = { version = "0.57", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }
