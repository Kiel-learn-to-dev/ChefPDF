[project]
name = "chef-core"
version = "0.1.0"
description = "Chef PDF core sidecar (JSON-RPC over stdio)"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "pikepdf>=9.0",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "img2pdf>=0.5",
  "pyhanko>=0.38",
  "reportlab>=4.2",
  "fonttools>=4.68.0",
  "openpyxl>=3.1.5",
  "segno>=1.6.6",
  "python-barcode>=0.16.1",
  "numpy>=2.5.4",
  "opencv-python-headless>=5.0.0.93",
  "onnxruntime>=1.19.2",
  "python-docx>=1.2.0",
]

[project.optional-dependencies]
token = [
    "pyhanko[pkcs11]>=0.38",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyhanko[pkcs11]>=0.38",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chef_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
packages = ["chef_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["slow: long-running benchmark-style tests; run with CHEF_SLOW=1"]
