name: Native Windows

on:
  push:
    branches: ['new-rust']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check and build Rust app (Windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/native

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Fetch matching pdfium DLL
        run: node scripts/fetch-pdfium.mjs

      - name: Format
        working-directory: apps/native
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: apps/native
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        working-directory: apps/native
        run: cargo test --workspace --all-targets

      - name: Dependency policy
        working-directory: apps/native
        run: cargo deny check

      - name: Build release executable
        working-directory: apps/native
        run: cargo build --release -p chef-app

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: chef-pdf-native-windows-x64
          if-no-files-found: error
          path: |
            apps/native/target/release/chef-app.exe
            apps/native/target/release/pdfium.dll
          retention-days: 14
